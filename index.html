<title>Cérébro – Jeux cérébraux</title>
<style>

:root[data-theme="dark"]{--bg:#17121f;--fg:#f4eefa;--mut:#a89fb5;--gl:rgba(255,255,255,.09);--gb:rgba(255,255,255,.24);--sh:rgba(0,0,0,.5)}

main{max-width:520px;margin:0 auto;padding:20px 14px 120px}
h1{font-size:1.9rem;margin:0;text-align:center}

.glass,.card,.chip,.tile,.lamp,.inp,#bar,.top{background:var(--gl);backdrop-filter:blur(22px) saturate(210%) brightness(1.06);-webkit-backdrop-filter:blur(22px) saturate(210%) brightness(1.06);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 var(--gb),inset 1.5px 0 0 rgba(255,255,255,.28),inset 0 -1.5px 0 rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.1),0 10px 32px var(--sh);position:relative;overflow:hidden;color:var(--fg)}
.glass::before,.card::before,.chip::before,.tile::before,.lamp::before,#bar::before,.top::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 18% 0,rgba(255,255,255,.5),transparent 55%),linear-gradient(135deg,rgba(255,255,255,.4),transparent 40%,transparent 70%,rgba(255,255,255,.22));opacity:.75;pointer-events:none}

#bar::after{content:"";position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:999px;background:var(--gb);opacity:.6;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 12px var(--sh);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#bar.mini .tab b{max-height:0;opacity:0}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:7px 2px 6px;border-radius:999px;font:inherit;color:var(--mut);cursor:pointer;transition:color .3s}
.tab i{font-style:normal;font-size:1.3rem;line-height:1.1;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tab b{font-size:.68rem;font-weight:700;max-height:1.2em;overflow:hidden;transition:max-height .3s,opacity .3s}
.tab:active i{transform:scale(.86)}
.tab.on{color:var(--acc)}.tab.on i{transform:scale(1.08)}

.chip.on{background:var(--acc);color:#fff}
.card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:22px;font:inherit;text-align:left;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.card:active,.tile:active,.btn:active{transform:scale(.97)}
.card:disabled{opacity:.6;cursor:default}
.card small{color:var(--mut)}
.ic{font-size:1.9rem;flex:none}
.badge{margin-left:auto;font-size:.75rem;color:var(--mut);text-align:center;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:22px;margin-bottom:12px}
.btn{position:relative;background:var(--acc);color:#fff;border:0;border-radius:16px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 18px rgba(124,77,255,.35)}

.grid{display:grid;gap:10px}
.tile{aspect-ratio:1;border-radius:20px;font:inherit;font-size:clamp(1rem,6vw,1.9rem);cursor:pointer}
.tile.wide{aspect-ratio:2/1;font-size:1.4rem}
.tile:disabled{opacity:.45}
.q{text-align:center;font-size:2.2rem;margin:18px 0;line-height:1.3}
.lamp{display:block;margin:28px auto;width:70%;aspect-ratio:1;border-radius:50%;font-size:4rem;cursor:pointer}
.inp{width:100%;font:inherit;font-size:1.8rem;text-align:center;padding:12px;border-radius:18px}
.res{text-align:center;padding:26px 16px;border-radius:28px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tile.e{font-size:clamp(1.8rem,8.5vw,2.7rem)}
.tile.w{font-size:clamp(.78rem,3.6vw,1.15rem);padding:2px;line-height:1.1;overflow-wrap:anywhere}
.tile.ok{background:#22c55e;color:#fff}.tile.ko{background:#ef4444;color:#fff}.tile.miss{box-shadow:0 0 0 4px #f59e0b}
button{touch-action:manipulation}
.wg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;margin:0 auto 16px}
.wc{aspect-ratio:1;display:grid;place-items:center;font-size:1.9rem;font-weight:800;border:2px solid var(--gb);border-radius:12px;background:var(--gl)}
.kb{display:grid;gap:6px;max-width:520px;margin:0 auto}
.kb>div{display:flex;gap:5px;justify-content:center}
.key{flex:1;min-width:0;padding:14px 0;border:1px solid var(--gb);border-radius:10px;font:inherit;font-weight:700;background:var(--gl);color:var(--fg);cursor:pointer}
@media(min-width:700px){
main{max-width:980px;padding:28px 28px 130px}
h1{font-size:2.4rem}h2{font-size:1.4rem}
.sub,.info{font-size:1.05rem}
#bar{max-width:520px}.tab b{font-size:.78rem}
#fl{max-width:660px;margin:0 auto;max-height:68vh}
.chips{justify-content:center;flex-wrap:wrap}
#list,#ln{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
#list>h2,#list>.sub,#ln>h2,#ln>.sub,#ln>.res,#ln>.btn{grid-column:1/-1}
.card{margin-bottom:0;padding:16px 18px}
.ic{font-size:2.3rem}
#game{max-width:720px;margin:0 auto}
#body{max-width:600px;margin:0 auto}
.top{padding:10px 14px}
.q{font-size:2.8rem}
.tile{font-size:clamp(1.2rem,4vw,2.4rem)}.tile.wide{font-size:1.7rem}
.grid{gap:14px}
.btn{padding:14px 26px;font-size:1.05rem}
.lamp{width:50%;max-width:320px}
.inp{max-width:420px;margin:0 auto;display:block}
.res{padding:40px 28px}
.wg{max-width:400px}.key{padding:18px 0;font-size:1.1rem}
}
</style>
</head>

<main>

const D=[['Mémoire','#9b5de5','Conserver et utiliser des informations pendant quelques secondes ou quelques jours.'],['Attention','#f59e0b','Concentrez-vous sur ce qui est important et ignorez ce qui distrait.'],['Vitesse','#f97316','Analysez ce que vous voyez et réagissez rapidement sans faillir.'],['Flexibilité','#14b8a6','Modifier les règles ou les tâches sans perdre le fil.'],['Logique','#22c55e','Repérez les schémas et planifiez plusieurs étapes.'],['Calcul','#3b82f6','Calculez mentalement en toute simplicité.'],['Langage','#ec4899','Trouvez et ordonnez les mots rapidement.'],['Vision spatiale','#c026d3','Imaginez des formes, des virages et des positions.']];

const A=[['🐢',`Réviser juste avant d’oublier`,2,`On oublie vite après un apprentissage, puis de plus en plus lentement.|Le meilleur moment pour réviser est juste avant que le souvenir ne s’efface : chaque rappel le rend plus durable.|Essayez de revoir une notion le lendemain, puis 3 jours plus tard, une semaine plus tard, puis un mois plus tard.`],

['⛺',`Le Palais de la Mémoire`,3,`Cette méthode très ancienne s’appuie sur notre bonne mémoire des lieux.|Choisissez un trajet que vous connaissez par cœur, par exemple votre logement : entrée, salon, cuisine, chambre.|Placez une image marquante, même absurde, de chaque élément à retenir à chaque étape du trajet.|Pour vous rappeler la liste, refaites le parcours en pensée, étape par étape.`],

      const g=tp;rows.push(g);score(g).forEach((v,i)=>st[g[i]]=Math.max(st[g[i]]??-1,v));tp='';
      if(g===w){done=1;draw();setTimeout(()=>fin(true,'Trouvé en '+rows.length+' essai(s) : '+w+'.'),900);return}
      if(rows.length===6){done=1;draw();setTimeout(()=>fin(false,'Le mot était '+w+'.'),900);return}
    }else if(tp.length<5)tp+=k;
    draw();
  };
  B.onclick=e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  KD=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key==='Enter'?'OK':e.key==='Backspace'?'⌫':e.key.length===1?e.key.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase():'';if(/^([A-Z]|OK|⌫)$/.test(k)){e.preventDefault();press(k)}};
  draw();
}});
const LK='chg faces wpairs story where order dnb pattern diff mot codes rhythm rule dots cards hanoi sudoku slide maze matrix london nono mines target numline dict sprint make wordle speed rot cubes path mirror blocks'.split(' ');let lj=0;
C.forEach(g=>{if(!g.k)g.k=LK[lj++]});C.forEach(g=>{if(!E[g.k]&&!Qz[g.k])g.k=''});
